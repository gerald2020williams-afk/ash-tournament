function cpReport(){printHTML(`<div class="letter"><h2 style="margin-top:0">Compliance report</h2><div style="color:var(--muted);font-size:13px">${esc(curProp.name)} · ${fmtD(today)}</div><table class="ctab" style="margin-top:12px"><thead><tr><th>Item</th><th>How often</th><th>Last done</th><th>Next due</th><th>Status</th><th>Certificate</th></tr></thead><tbody>${S.compliance.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.every)}</td><td>${c.last?fmtD(c.last):'—'}</td><td>${c.next?fmtD(c.next):'—'}</td><td>${CP_PILL[cpState(c)][1]}</td><td>${c.certs.length?'On file':'—'}</td></tr>`).join('')}</tbody></table></div>`+S.compliance.flatMap(c=>c.certs.filter(x=>/^data:image/.test(x.data)).slice(0,1).map(x=>`<div class="letter"><h3>${esc(c.name)} · ${fmtD(x.date)}</h3><img src="${x.data}" style="max-width:100%" alt="Certificate"></div>`)).join(''))}

// ---------- move-in vs move-out comparison ----------
const CRANK={Good:0,Fair:1,Damaged:2};
function moveInFor(o){return S.inspections.filter(i=>i.type==='Move-in'&&i.unit===o.unit&&i.date<=o.date&&(!o.rid||!i.rid||i.rid===o.rid)).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function compareView(oid){const o=S.inspections.find(x=>x.id===oid),m=moveInFor(o);
  if(!m)return modal(`<h3>No move-in inspection on file</h3><p>Unit ${esc(o.unit)} has no move-in walk-through to compare with. Without one, it's harder to show the damage happened during this lease.</p><p style="font-size:13px;color:var(--muted)">From now on, do a move-in inspection with photos for every new resident. Doorline will compare it automatically at move-out.</p><div class="actions"><button class="btn pri" data-close>OK</button></div>`);
  const keys=ROOMS.flatMap(([r,its])=>its.map(it=>r+'|'+it));const g=(i,k)=>i.items[k]||{c:'Good',n:'',p:''};
  const rows=keys.map(k=>{const a=g(m,k),b=g(o,k),worse=CRANK[b.c]>CRANK[a.c];return {k,a,b,worse,same:CRANK[b.c]<=CRANK[a.c]&&b.c!=='Good'}});
  const worse=rows.filter(r=>r.worse),dep=S.deposits.find(d=>d.unit===o.unit&&d.status==='Due'&&(!o.rid||!d.rid||d.rid===o.rid));
  const cell=(x,lbl)=>`<div class="cmpc"><div class="m">${lbl}</div><span class="pill ${x.c==='Damaged'?'p-bad':x.c==='Fair'?'p-warn':'p-good'}">${x.c}</span>${x.n?`<div class="m">${esc(x.n)}</div>`:''}${x.p?`<img src="${x.p}" alt="${lbl} photo">`:'<div class="nophoto">No photo</div>'}</div>`;
  modal(`<h3>Move-in vs move-out · Unit ${esc(o.unit)}</h3><p style="font-size:13px;color:var(--muted);margin:0">${esc(o.resident)} · Move-in ${fmtD(m.date)} · Move-out ${fmtD(o.date)}</p>
  <p style="font-size:14px">${worse.length?`<b>${worse.length} item${worse.length>1?'s':''} got worse during the lease.</b> Enter a charge for each one you want on the deposit letter.`:'Nothing got worse since move-in.'} Items that were already fair or damaged at move-in can't be charged.</p>
  <div class="cmplist">${rows.filter(r=>r.worse||r.same||r.a.p||r.b.p).map((r,i)=>`<div class="cmp ${r.worse?'worse':''}"><div class="t">${esc(r.k.replace('|',' · '))}${r.worse?' <span class="pill p-bad">Worse</span>':r.same?' <span class="pill p-mute">Same as move-in</span>':''}</div><div class="cmpg">${cell(r.a,'Move-in')}${cell(r.b,'Move-out')}</div>${r.worse?`<div class="cmpcharge"><label for="cc${i}">Charge for this ($)</label><input id="cc${i}" data-ck="${esc(r.k)}" inputmode="decimal" placeholder="0.00"></div>`:''}</div>`).join('')||'<div class="empty">Every item was in good condition at both walk-throughs.</div>'}</div>
  <p style="font-size:12px;color:var(--muted)">Texas law doesn't allow charging for normal wear and tear. Charge only for damage beyond normal use, and keep these photos with the deposit letter.</p>
  <div class="actions"><button class="btn" data-close>Close</button><button class="btn" id="cmpprint">Print with photos</button>${worse.length?`<button class="btn pri" id="cmpadd">${dep?'Add charges to deposit letter':'Start move-out with these charges'}</button>`:''}</div>`,()=>{
    $('#cmpprint').onclick=()=>printHTML(`<div class="letter"><h2 style="margin-top:0">Move-in and move-out comparison</h2><p>Unit ${esc(o.unit)} · ${esc(o.resident)}<br>Move-in walk-through ${fmtD(m.date)} · Move-out walk-through ${fmtD(o.date)}</p><div class="cmplist">${rows.filter(r=>r.worse||r.same).map(r=>`<div class="cmp"><div class="t">${esc(r.k.replace('|',' · '))}</div><div class="cmpg">${cell(r.a,'Move-in')}${cell(r.b,'Move-out')}</div></div>`).join('')}</div></div>`);
    const ad=$('#cmpadd');ad&&(ad.onclick=()=>{const ch=[...document.querySelectorAll('[data-ck]')].map(i=>({k:i.dataset.ck,amt:Math.round((parseFloat(i.value)||0)*100)/100})).filter(x=>x.amt>0);if(!ch.length)return toast('Enter at least one charge');
      const ded=ch.map(x=>({desc:x.k.replace('|',' · ')+': '+(g(o,x.k).n||'damaged since move-in'),amt:x.amt,photoIn:g(m,x.k).p?1:0,photoOut:g(o,x.k).p?1:0}));
      let d=dep;if(!d){const r=resById(o.rid)||S.residents.find(x=>x.unit===o.unit);d={id:uid(),name:o.resident,unit:o.unit,rid:o.rid||(r&&r.id),moveOut:o.date,deposit:(r&&r.deposit)||0,deductions:[],forwarding:'',status:'Due'};S.deposits.unshift(d)}
      d.deductions=d.deductions.filter(x=>x.desc!=='Damage from move-out inspection');d.deductions.push(...ded);log(`Added ${ch.length} damage charge${ch.length>1?'s':''} (${money(ch.reduce((a,x)=>a+x.amt,0))}) to ${o.resident}'s deposit letter from the move-in/move-out comparison.`);close();toast('Added to the deposit letter');depositForm(d.id)})})}
addPart('inspDetail','Compare with move-in button',function(id){const i=S.inspections.find(x=>x.id===id);if(i.type!=='Move-out')return;
  $('#layer .actions').insertAdjacentHTML('afterbegin',`<button class="btn" id="tocmp">${ico('compare')}Compare with move-in</button>`);$('#tocmp').onclick=()=>compareView(id)});
addPart('depositForm','Damage found at move-out goes to the deposit letter',function(id){const d=S.deposits.find(x=>x.id===id),o=S.inspections.filter(i=>i.type==='Move-out'&&i.unit===d.unit).sort((a,b)=>b.date.localeCompare(a.date))[0];

// ---------- resident surveys and review requests ----------
const SV_KIND={repair:'After a repair',movein:'After move-in',renewal:'Before renewal',general:'General'};
const SV_Q={repair:'How did we do on your repair?',movein:'How was your move-in?',renewal:'How do you like living here?',general:'How are we doing?'};
function svSend(r,kind,ref){if(!r||S.surveys.sent.some(s=>s.rid===r.id&&s.kind===kind&&(s.ref||'')===(ref||'')))return false;S.surveys.sent.push({id:'ss'+uid(),rid:r.id,unit:r.unit,kind,ref:ref||'',date:today,via:r.portal==='Active'?'app':r.phone?'text':r.email?'email':'print'});S.notify.push({rid:r.id,t:new Date().toISOString(),text:SV_Q[kind]+' Tap to rate us, it takes 10 seconds.'});return true}
function autoSurveys(){if(!S.surveys)return;const a=S.settings.autoSurvey||{};let n=0;
  if(a.repair)S.workOrders.filter(w=>w.status==='Complete'&&w.doneDate&&daysUntil(w.doneDate)>=-2&&!w.rating&&/^\d/.test(w.unit)).forEach(w=>{const r=S.residents.find(x=>x.unit===w.unit);if(svSend(r,'repair',w.id))n++});
  if(a.movein)S.residents.forEach(r=>{const mi=r.moveIn;if(mi&&daysUntil(mi)<=-30&&daysUntil(mi)>=-45&&svSend(r,'movein'))n++});
  if(a.renewal)S.residents.forEach(r=>{const d=daysUntil(r.leaseEnd);if(d<=100&&d>=90&&svSend(r,'renewal',r.leaseEnd))n++});
  if(n)S.log.unshift({t:new Date().toISOString(),who:'System',text:`Sent ${n} resident survey${n>1?'s':''} automatically.`})}
addPart('render:before','Send surveys that are due',autoSurveys);
function svAll(){const wo=S.workOrders.filter(w=>w.rating).map(w=>{const r=S.residents.find(x=>x.unit===w.unit);return {id:'w'+w.id,kind:'repair',score:w.rating,comment:w.ratingNote||'',date:w.doneDate||w.created,unit:w.unit,name:r?r.name:'',rid:r&&r.id,wo:w.id,followup:w.rating<=2&&daysUntil(w.doneDate||w.created)>=-30?(w.ratingFollow||{status:'Open'}):null}});return [...S.surveys.responses,...wo].sort((a,b)=>b.date.localeCompare(a.date))}
VIEWS.surveys=()=>{const all=svAll(),avg=l=>l.length?(l.reduce((a,x)=>a+x.score,0)/l.length).toFixed(1):'—',open=all.filter(x=>x.followup&&x.followup.status==='Open');
  const sent30=S.surveys.sent.filter(s=>daysUntil(s.date)>=-30).length,ans30=all.filter(x=>daysUntil(x.date)>=-30).length;
  $('#view').innerHTML=`<h1>Surveys</h1><p class="sub">Short ratings from residents after a repair, after move-in and before renewal. Low scores come to you for a call back. Every resident who answers is also invited to leave a public review.</p>
  <div class="stats"><div class="stat" style="cursor:default"><b class="num">${avg(all)}</b><span>average rating, out of 5 (${all.length} answers)</span></div>${['repair','movein','renewal'].map(k=>{const l=all.filter(x=>x.kind===k);return `<div class="stat" style="cursor:default"><b class="num">${avg(l)}</b><span>${SV_KIND[k].toLowerCase()} (${l.length})</span></div>`}).join('')}</div>
  <div class="toolbar"><button class="btn pri" id="svsend">Send a survey</button><span class="fcount" style="margin:0">${sent30} sent and ${ans30} answered in the last 30 days</span></div>
  ${open.length?`<h2>Call these residents back</h2><div class="list">${open.map(x=>`<div class="row"><span class="pill p-bad">${'★'.repeat(x.score)}</span><div class="main"><div class="t">${esc(x.name)} · Unit ${esc(x.unit)}</div><div class="m">${SV_KIND[x.kind]} · ${fmtD(x.date)}${x.comment?' · "'+esc(x.comment)+'"':''}</div></div><button class="btn pri" data-svf="${x.id}">Mark called</button></div>`).join('')}</div>`:''}
  <h2>Recent answers</h2><div class="list">${all.slice(0,40).map(x=>`<div class="row"><span class="pill ${x.score>=4?'p-good':x.score===3?'p-warn':'p-bad'}" aria-label="${x.score} of 5">${'★'.repeat(x.score)}${'☆'.repeat(5-x.score)}</span><div class="main"><div class="t" style="font-weight:500">${x.comment?esc('"'+x.comment+'"'):'<span style="color:var(--muted)">No comment</span>'}</div><div class="m">${esc(x.name)}${x.unit?' · Unit '+esc(x.unit):''} · ${SV_KIND[x.kind]}${x.wo?' ('+x.wo+')':''} · ${fmtD(x.date)}${x.reviewClicked?' · <b style="color:var(--good)">opened the review link</b>':''}</div></div></div>`).join('')||'<div class="empty">No answers yet.</div>'}</div>
  <h2>Survey settings</h2><div class="room" style="padding-top:12px"><label for="svlink" style="margin-top:0">Your Google review link</label><input id="svlink" value="${esc(S.settings.reviewLink||'')}" placeholder="Paste the link from your Google Business Profile">
  <p style="font-size:13px;color:var(--muted)">Google's rules don't allow asking only happy residents for reviews, so Doorline shows this link to everyone who answers.</p>
  ${['repair','movein','renewal'].map(k=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-top:8px"><input type="checkbox" data-sva="${k}" style="width:20px;height:20px" ${(S.settings.autoSurvey||{})[k]?'checked':''}>Send automatically ${k==='repair'?'when a repair is marked complete':k==='movein'?'30 days after move-in':'100 days before the lease ends'}</label>`).join('')}
  <div class="actions"><button class="btn pri" id="svsave">Save settings</button></div></div>`;
  document.querySelectorAll('[data-svf]').forEach(b=>b.onclick=()=>{const x=svAll().find(y=>y.id===b.dataset.svf),done={status:'Done',by:cur.name,date:today};if(x.wo){woById(x.wo).ratingFollow=done}else S.surveys.responses.find(y=>y.id===x.id).followup=done;log(`Called back ${x.name} (Unit ${x.unit}) about a ${x.score}-star survey.`);toast('Marked as called');showScreen('surveys')});
  $('#svsave').onclick=()=>{const l=$('#svlink').value.trim();if(l&&!/^https:\/\//.test(l))return toast('Enter a link that starts with https://');S.settings.reviewLink=l;S.settings.autoSurvey={};document.querySelectorAll('[data-sva]').forEach(c=>S.settings.autoSurvey[c.dataset.sva]=c.checked);log('Updated survey settings.');toast('Survey settings saved');showScreen('surveys')};
  $('#svsend').onclick=()=>{const G=[['all','All residents'],['recent','Residents with a repair finished in the last 14 days'],['ren','Leases ending in the next 90 days'],['new','Moved in during the last 60 days']];
    modal(`<h3>Send a survey</h3><label for="svg">Send to</label><select id="svg">${G.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><label for="svk">Question</label><select id="svk">${Object.entries(SV_Q).map(([k,q])=>`<option value="${k}" ${k==='general'?'selected':''}>${esc(q)}</option>`).join('')}</select><p id="svc" style="font-size:13px;color:var(--muted)"></p><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn pri" id="svgo">Send</button></div>`,()=>{
      const pick=()=>{const v=$('#svg').value;return S.residents.filter(r=>v==='all'||(v==='ren'&&daysUntil(r.leaseEnd)>=0&&daysUntil(r.leaseEnd)<=90)||(v==='recent'&&S.workOrders.some(w=>w.unit===r.unit&&w.status==='Complete'&&daysUntil(w.doneDate||'2000-01-01')>=-14))||(v==='new'&&r.moveIn&&daysUntil(r.moveIn)>=-60))};
      const c=()=>$('#svc').textContent=pick().length+' residents. Each gets it by app, text or email; anyone already asked this question is skipped.';$('#svg').onchange=c;c();
      $('#svgo').onclick=()=>{const k=$('#svk').value,ref='m'+today.slice(0,7);let n=0;pick().forEach(r=>{if(svSend(r,k,ref))n++});log(`Sent a "${SV_Q[k]}" survey to ${n} residents.`);close();toast(n?`Sent to ${n} residents`:'Everyone in that group was already asked');showScreen('surveys')}})}};

addPart('screen:home','Survey card for residents',function(){const r=S.residents.find(x=>x.unit===cur.unit);if(!r)return;const s=S.surveys.sent.find(x=>x.rid===r.id&&!x.answered);if(!s)return;
  $('#view h1').insertAdjacentHTML('afterend',`<div class="room" id="svcard" style="padding-top:12px;border-color:var(--accent)"><b>${esc(SV_Q[s.kind])}</b><div class="stars" role="radiogroup" aria-label="Rating">${[1,2,3,4,5].map(n=>`<button class="star" role="radio" aria-checked="false" aria-label="${n} star${n>1?'s':''}" data-st="${n}">★</button>`).join('')}</div><label for="svcm">Anything to add? (optional)</label><input id="svcm"><div class="actions"><button class="btn" id="svno">Not now</button><button class="btn pri" id="svok">Send</button></div></div>`);

// ---------- market rent survey (public prices only) ----------
const BEDS=['Studio','1 bed','2 bed','3 bed'];
const bedsOf=f=>/studio/i.test(f.name)?'Studio':((f.name.match(/(\d)\s*bed/i)||[])[1]||'1')+' bed';
const COMP_SRC=['Their website','Apartments.com','Zillow','Other listing site','Phone call as a shopper','Sign or flyer'];
function compStats(){const latest={};S.comps.entries.filter(e=>daysUntil(e.date)>=-45).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>latest[e.pid+'|'+e.beds]=e);
  return BEDS.map(b=>{const fps=S.floorPlans.filter(f=>bedsOf(f)===b),units=fps.flatMap(f=>String(f.units).split(',').map(x=>x.trim()).filter(Boolean));
    const res=S.residents.filter(r=>units.includes(r.unit)),vac=S.turns.filter(t=>t.status!=='done'&&units.includes(t.unit)).length;
    const mk=Object.values(latest).filter(e=>e.beds===b),avg=l=>l.length?Math.round(l.reduce((a,x)=>a+x,0)/l.length):0;
    return {b,ask:avg(fps.map(f=>+f.rent)),cur:avg(res.map(r=>+r.rent)),units:units.length,vac,mkt:avg(mk.map(e=>+e.rent)),lo:mk.length?Math.min(...mk.map(e=>+e.rent)):0,hi:mk.length?Math.max(...mk.map(e=>+e.rent)):0,n:mk.length,specials:mk.filter(e=>e.specials),fps,psf:avg(mk.filter(e=>e.sqft).map(e=>e.rent/e.sqft*100))/100,mypsf:fps.length?Math.round(fps.reduce((a,f)=>a+f.rent/(f.sqft||1),0)/fps.length*100)/100:0}}).filter(x=>x.fps.length||x.n)}
function compAdvice(s){if(!s.n||!s.ask)return 'Add at least one nearby price for this type.';const diff=Math.round((s.ask/s.mkt-1)*1000)/10;
  const vr=s.units?s.vac/s.units:0;
  if(diff>3&&vr>=.08)return `Your asking rent is ${diff}% above the nearby average and ${s.vac} units are vacant. Consider moving closer to ${money(s.mkt)}.`;
  if(diff<-3&&vr<=.06)return `You're ${Math.abs(diff)}% below the nearby average and ${s.vac?'only '+s.vac+' of '+s.units+' are vacant':'fully leased'}. There may be room to move toward ${money(s.mkt)} on renewals and new leases (your renewal cap is ${S.settings.maxIncreasePct}%).`;
  return `Your asking rent is ${diff>0?diff+'% above':diff<0?Math.abs(diff)+'% below':'right at'} the nearby average. No change suggested.`}
VIEWS.comps=()=>{const st=compStats(),last=S.comps.entries.reduce((a,e)=>e.date>a?e.date:a,''),age=last?-daysUntil(last):null;
  $('#view').innerHTML=`<h1>Market rents</h1><p class="sub">Compare your rents to what nearby properties advertise. You enter public prices once a week; Doorline compares them to your own rents and vacancies. You decide what to charge.</p>

function bookOut(from,to){const o=[];

function bankParse(text){const rows=parseCSV(text);if(rows.length<2)return {err:'That file has no rows.'};const h=rows[0].map(x=>x.toLowerCase().trim()),f=re=>h.findIndex(x=>re.test(x));
  const di=f(/date/),de=f(/desc|memo|payee|name|detail/),am=f(/^amount$|amount/),dr=f(/debit|withdraw/),cr=f(/credit|deposit/),ck=f(/check|cheque|ref/);
  if(di<0||(am<0&&dr<0&&cr<0))return {err:"Couldn't find the date and amount columns. The file needs a header row with Date and Amount (or Debit and Credit)."};
  const num=s=>{s=String(s||'').replace(/[$,\s]/g,'');const neg=/^\(.*\)$/.test(s)||/^-/.test(s);const v=parseFloat(s.replace(/[()-]/g,''));return isNaN(v)?0:neg?-v:v};

  const out=[];rows.slice(1).forEach(r=>{const date=iso(r[di]);if(!date)return;let a=am>=0&&r[am]!==''?num(r[am]):num(r[cr])-Math.abs(num(r[dr]));if(!a)return;out.push({date,desc:(de>=0?r[de]:'').trim()+(ck>=0&&ck!==de&&r[ck]?' #'+r[ck].trim():''),cents:Cn(a)})});return {txns:out}}

async function sha256(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return ''}}

function signPage(x,who){const e=x.envelope,f=e.fields,me=who==='resident'?x.name:cur.name;

  <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input type="checkbox" id="sg1" style="width:20px;height:20px;flex:none">I agree to sign electronically and get my copy electronically. I can ask for a paper copy at the office.</label>

  <label for="sgpad">Sign with your finger or mouse</label><canvas id="sgpad" class="sigpad" width="600" height="160" aria-label="Signature box"></canvas><div class="actions" style="justify-content:flex-start;margin-top:4px"><button class="btn" id="sgclr" type="button">Clear</button></div>

      prospectStep_base(x);$('#lsig').value=x.name;$('#pgo').click();const nr=S.residents.find(r=>r.name===x.name&&r.leaseEnd===addDaysFrom(x.lease.start,364));if(nr){nr.moveIn=x.lease.start;nr.docs=nr.docs||[];nr.docs.push({id:uid(),name:'Signed lease '+e.id,kind:'Lease',date:today,data:'',envelope:x.id})}save()}})}

ntor':'A co-signer who promises to pay if the resident doesn\'t.','Inspection':'A walk-through of a unit to record its condition.','Work order':'A repair request, from start to finish.','Owner statement':'The monthly money report you send to the property owner.','Deposit report':'The list of money orders and checks to take to the bank.'};

    ${n<3?`<label class="camb">${ico('camera')}<span>${n===1?'Take the BEFORE photo':'Take the AFTER photo'}</span><input type="file" id="qcam" accept="image/*" capture="environment" hidden></label><div class="actions"><button class="btn" data-close>Cancel</button>${n===1?'<button class="btn" id="qskip">No photos, finish normally</button>':''}</div>`:`<div class="qthumbs"><img src="${URL.createObjectURL(before)}" alt="Before"><img src="${URL.createObjectURL(after)}" alt="After"></div><div class="actions"><button class="btn" id="qredo">Retake</button><button class="btn pri big" id="qgo">${ico('check')}Complete</button></div>`}`,()=>{
