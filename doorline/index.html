<title>Doorline Management & Maintenance</title>

<style>
/* Layout: app shell — slim top bar, scrolling tab strip, one working column; rows not cards; help overlay spotlights real controls */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#18242b; --muted:#5c6b72; --line:#dce3e2;
  --accent:#1f5f6b; --accent-ink:#ffffff; --brass:#a8741a; --soft:#e4eeee;
  --good:#276b42; --warn:#8a5600; --bad:#b3372e; --good-bg:#e3f2e8; --warn-bg:#fbf0dc; --bad-bg:#f8e3e0;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a1e; --surface:#18242a; --ink:#e6eeee; --muted:#9aaab0; --line:#2a3a41;
  --accent:#5fb3c0; --accent-ink:#0d1a1e; --brass:#e0ad55; --soft:#1f3239;
  --good:#6fcf95; --warn:#f0b452; --bad:#f08a80; --good-bg:#1b3326; --warn-bg:#3a2d14; --bad-bg:#3d1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a1e; --surface:#18242a; --ink:#e6eeee; --muted:#9aaab0; --line:#2a3a41;
  --accent:#5fb3c0; --accent-ink:#0d1a1e; --brass:#e0ad55; --soft:#1f3239;
  --good:#6fcf95; --warn:#f0b452; --bad:#f08a80; --good-bg:#1b3326; --warn-bg:#3a2d14; --bad-bg:#3d1f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:22px;border:2.5px solid var(--accent);border-radius:7px 7px 2px 2px;position:relative}
.brand i::after{content:"";position:absolute;right:2px;top:9px;width:3px;height:3px;border-radius:50%;background:var(--brass)}
.prop{color:var(--muted);font-size:13px}
.spacer{flex:1}
.role{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.role button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.role button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.help-btn{border:0;background:var(--brass);color:#fff;border-radius:999px;padding:7px 14px;font:700 13px var(--body);cursor:pointer}
:root[data-theme="dark"] .help-btn{color:#1a1206}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .help-btn{color:#1a1206}}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
nav.tabs button{flex:none;border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 60px}
h1{font-family:var(--display);font-size:26px;line-height:1.15;margin:0 0 4px;text-wrap:balance;letter-spacing:-.015em}
h2{font-family:var(--display);font-size:18px;margin:26px 0 10px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:65ch}
.demo{font-size:12px;color:var(--muted);background:var(--soft);border-radius:6px;padding:6px 10px;display:inline-block;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat b{display:block;font:600 24px var(--display)}
.stat span{color:var(--muted);font-size:13px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .main{flex:1 1 220px;min-width:0}
.row .t{font-weight:600}
.row .m{color:var(--muted);font-size:13px}
.row .t,.row .m{overflow-wrap:anywhere}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;min-width:84px;text-align:right}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-mute{background:var(--soft);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 13px var(--body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dang{color:var(--bad);border-color:var(--bad)}
.btn.big{padding:12px 18px;font-size:15px}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.note{border-left:3px solid var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;margin:10px 0}
.empty{padding:18px;color:var(--muted);text-align:center}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;max-width:560px;font-size:14px}
.letter h3{font-family:var(--display);margin:0 0 4px;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,24,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.sheet{border-radius:14px}}
.sheet h3{font-family:var(--display);margin:0 0 6px;font-size:19px}
.sheet .actions{margin-top:16px;justify-content:flex-end}
.choice{display:block;width:100%;text-align:left;margin-top:8px}
.choice small{display:block;font-weight:400;color:var(--muted)}
/* tour */
.tour-spot{position:fixed;z-index:60;border-radius:10px;box-shadow:0 0 0 4px var(--brass),0 0 0 9999px rgba(10,20,24,.55);pointer-events:none;transition:all .2s}
.tour-card{position:fixed;z-index:61;background:var(--surface);border-radius:12px;padding:14px 16px;width:min(340px,calc(100vw - 32px));box-shadow:0 10px 30px rgba(0,0,0,.3)}
.tour-card .step{font-size:12px;color:var(--brass);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:70;font-weight:600;font-size:14px}
.guides button{display:block;width:100%;text-align:left;margin-top:6px}
#printarea{display:none}
.alarm{border:2px solid var(--bad);background:var(--bad-bg);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.alarm b{color:var(--bad)}
.prop-sel{width:auto;padding:4px 8px;font-size:13px;color:var(--muted)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.cell{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font:600 13px var(--mono);background:var(--surface);color:var(--ink);cursor:pointer}
.cell.c-hot{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}.cell.c-open{background:var(--warn-bg);color:var(--warn);border-color:transparent}.cell.c-vac{border-style:dashed;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:80px;flex:1 1 120px}.meter i{display:block;height:100%;background:var(--accent)}.meter i.over{background:var(--bad)}
:root.hc{--muted:#2b373c;--line:#75858b;--soft:#d4e2e2}
@media (prefers-color-scheme: dark){:root.hc:not([data-theme="light"]){--muted:#d5e0e2;--line:#6f8790;--soft:#29434c}}
:root.hc[data-theme="dark"]{--muted:#d5e0e2;--line:#6f8790;--soft:#29434c}
:root.zoom-l body{zoom:1.15}:root.zoom-xl body{zoom:1.3}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:600 12px var(--body);background:var(--surface);color:var(--ink);cursor:pointer}
.chip.done{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.na{color:var(--muted);text-decoration:line-through}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:2px 16px}
.kv div{padding:6px 0;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.kv .m{color:var(--muted);font-size:12px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px 12px;margin-bottom:12px}
.item{display:grid;grid-template-columns:140px 130px minmax(0,1fr) auto;gap:8px;align-items:center;padding-top:10px}
@media(max-width:640px){.item{grid-template-columns:1fr 1fr}.item .in{grid-column:1/-1}}
.who-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.fl{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:720px){.fl{grid-template-columns:minmax(0,1fr)}}
.tpl{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:10px 14px;font:inherit;cursor:pointer}
.tpl:first-child{border-top:0}.tpl[aria-current="true"]{background:var(--soft);font-weight:700}
.tpl small{display:block;color:var(--muted);font-weight:400}
.preview .letter{max-width:none;white-space:pre-wrap}
@media print{header.top,main,#layer,.toast,body::before{display:none!important}#printarea{display:block!important}
 #printarea .letter{border:0;max-width:none;page-break-after:always;font-size:15px;color:#000;background:#fff;white-space:pre-wrap}body{background:#fff}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* v3: icons, grouped side menu, tech bottom bar, bell, filters, charts, toasts, accessibility */
:root{--c1:#0a7fa3;--c2:#b5791a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#1b9bb8;--c2:#b07a12}}
:root[data-theme="dark"]{--c1:#1b9bb8;--c2:#b07a12}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.btn .ic{width:16px;height:16px;margin-right:6px;vertical-align:-3px}
nav.tabs button{display:inline-flex;align-items:center;gap:6px}
nav.tabs button .ic{width:16px;height:16px;opacity:.85}
nav.tabs .grp{flex:none;width:1px;background:var(--line);margin:10px 4px}
nav.tabs .grp span{display:none}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:700}
.skip:focus{left:12px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;position:relative;padding:6px 10px}
#belln{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--body);text-align:center;padding:0 4px}
#hmenu{display:none}
.plogo{height:22px;width:auto;max-width:60px;object-fit:contain;vertical-align:middle;margin-right:6px;border-radius:4px}
@media(min-width:1100px){
  body.side nav.tabs{position:fixed;left:0;top:var(--hh,58px);bottom:0;width:228px;flex-direction:column;flex-wrap:nowrap;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:6px 10px 28px;gap:1px;z-index:4}
  body.side nav.tabs button{width:100%;text-align:left;border-bottom:0;border-radius:8px;padding:7px 10px;gap:10px;font-size:14px}
  body.side nav.tabs button:hover{background:var(--soft);color:var(--ink)}
  body.side nav.tabs button[aria-current="page"]{background:var(--soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
  body.side nav.tabs .grp{width:auto;background:none;margin:0}
  body.side nav.tabs .grp span{display:block;font:700 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
  body.side header.top .wrap{max-width:none}

}
@media(min-width:1500px){body.side main.wrap{margin-left:calc(228px + (100vw - 228px - 1040px)/2)}}
#bnav{display:none}
#bnav[hidden]{display:none!important}
@media(max-width:720px){
  #srch,#aa,#who,#lang{display:none!important}
  #hmenu{display:inline-flex}
  body.has-bnav #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  #bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);font:600 12px var(--body);min-height:62px;cursor:pointer}
  #bnav button .ic{width:24px;height:24px}

}
.flash{animation:flash 1.5s}
@keyframes flash{0%,60%{box-shadow:0 0 0 6px var(--warn-bg)}100%{box-shadow:none}}
.biglist{display:grid;gap:8px;margin-top:12px}
.biglist .btn{display:flex;align-items:center;gap:10px;text-align:left;text-decoration:none;font-size:15px}
.biglist .btn .ic{width:20px;height:20px;margin:0}
.toast{display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);border-radius:12px}
.toast .ic{width:18px;height:18px;color:var(--good-bg)}
.toast.t-warn{background:var(--bad);color:#fff}.toast.t-warn .ic{color:#fff}
.t-undo{border:0;background:none;color:inherit;font:700 14px var(--body);text-decoration:underline;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:4px 2px;white-space:nowrap}
.t-undo .ic{color:inherit}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 6px}
.filters input:not([type=checkbox]){flex:1 1 200px;width:auto;min-width:0;margin:0}
.filters select{width:auto;flex:0 1 auto;max-width:100%;margin:0}
.filters .selall{display:flex;align-items:center;gap:6px;margin:0;font-weight:600;font-size:13px}
.bk,.selall input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--accent)}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 8px;position:sticky;top:calc(var(--hh,58px) + 6px);z-index:3}
.bulk select{width:auto;max-width:100%;margin:0}
.fcount{margin:0 0 8px;color:var(--muted);font-size:13px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}
.chart{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px;overflow:hidden;min-width:0}
.chart figcaption{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chart figcaption span{color:var(--muted);font-size:13px}
.chart .lg{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:6px}
.chart .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c1)}.chart .lg i.s2{background:var(--c2)}
.chart .plot{position:relative;height:150px;margin:34px 0 0 44px;border-bottom:1px solid var(--line)}
.chart .gy{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.chart .gy span{position:absolute;right:100%;margin-right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.chart .bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.chart .bc{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;position:relative;min-width:0;outline-offset:0}
.chart .bc i{flex:1;max-width:26px;border-radius:4px 4px 0 0;background:var(--c1)}.chart .bc i.s2{background:var(--c2)}
.chart .bc:hover i,.chart .bc:focus i{opacity:.75}
.chart .bc:hover::after,.chart .bc:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:4px 8px;border-radius:6px;font-size:12px;white-space:nowrap;z-index:2;pointer-events:none}
.chart .bc:nth-child(-n+3)::after{left:0;transform:none}.chart .bc:nth-last-child(-n+3)::after{left:auto;right:0;transform:none}
.chart .bx{display:flex;gap:2px;margin-left:44px;font-size:11px;color:var(--muted)}
.chart .bx span{flex:1;min-width:0;white-space:nowrap;overflow:visible}
.chart .bx.few span{text-align:center}
.stats + .toolbar{margin-top:12px}
.chart details{margin-top:8px;font-size:13px}.chart summary{cursor:pointer;color:var(--muted)}
.ctab{border-collapse:collapse;margin-top:6px;width:100%}.ctab td,.ctab th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:right}.ctab td:first-child,.ctab th:first-child{text-align:left}
.lh{display:flex;align-items:center;gap:10px;padding-bottom:8px;margin-bottom:14px;border-bottom:3px solid var(--accent)}
.lh img{height:40px;width:auto;max-width:140px;object-fit:contain}.lh b{font-size:18px;font-family:var(--display)}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lab{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:8px;padding:8px;font-size:12px;break-inside:avoid;background:#fff;color:#000}
.lab .qr{width:84px;height:84px;flex:none}.lab .noqr{display:flex;align-items:center;justify-content:center;border:1px solid #000;font:700 11px var(--mono);text-align:center;overflow-wrap:anywhere;padding:4px}
.lab .mono{font-family:var(--mono);font-size:10px;color:#555}
kbd{font:700 12px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 8px;min-width:90px;text-align:center;background:var(--soft)}
[hidden]{display:none!important}

function prioRules(){const r=S.settings.prioRules||PRIO_DEFAULT;return ['Emergency','Urgent'].map(lv=>({lv,words:String(r[lv]||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean)}))}
function detectPriority(text){const t=' '+String(text).toLowerCase().replace(/[^a-z0-9/ ]+/g,' ').replace(/smoke (detector|alarm)s?|fire (extinguisher|alarm test)s?|leak (check|test)/g,' ')+' ';for(const {lv,words} of prioRules()){const hit=words.find(w=>t.includes(' '+w+' ')||(w.length>4&&t.includes(w)));if(hit)return {lv,hit}}return null}
function autoPriority(){if(S.settings.autoPrio===false)return;S.workOrders.forEach(w=>{if(w.prioChecked||!(w.status==='Open'||w.status==='Assigned'))return;w.prioChecked=true;const d=detectPriority(w.problem);
  if(d&&PRIO_RANK[d.lv]<PRIO_RANK[w.priority]){const was=w.priority;w.priority=d.lv;w.prioAuto=d.hit;(w.comments=w.comments||[]).push({who:'System',t:new Date().toISOString(),text:`Priority raised from ${was} to ${d.lv} automatically because it mentions "${d.hit}".`});S.log.unshift({t:new Date().toISOString(),who:'System',text:`${w.id} raised to ${d.lv} (mentions "${d.hit}").`})}})}
const byPriority=(a,b)=>(PRIO_RANK[a.priority]??2)-(PRIO_RANK[b.priority]??2)||a.created.localeCompare(b.created);
function render(){runParts('render:before');(S.clock||[]).forEach(c=>c.id||(c.id=uid()));genRecurring();autoPriority();autoAssign();emergencyAlerts();tabs();showScreen(VIEWS[view]?view:'today');save();const v=$('#view');decorate(v);a11yLabels(v);runParts('render');document.title=(($('#view h1')||{}).textContent||'Doorline')+' · Doorline'}

function reverse(r,k,iid){
  const it=(k==='c'?r.charges:r.payments).find(x=>x.id===iid);
  const what=k==='c'?`the ${it.desc} charge of ${money(it.amt)}`:`the ${money(it.amt)} ${it.method.toLowerCase()} payment`;
  modal(`<h3>Reverse this entry?</h3><p>This will remove ${esc(what)} from ${esc(r.name)}'s balance. Nothing is deleted: it stays in the ledger crossed out, and the History tab records who reversed it.</p>
  <p>New balance will be <b class="num">${money(bal(r)+(k==='c'?-it.amt:it.amt))}</b>.</p>
  <div class="actions"><button class="btn" data-close>Keep it</button><button class="btn dang" id="go">Reverse entry</button></div>`,()=>{
    $('#go').onclick=()=>{if(role==='asst'&&it.amt>(S.settings.reverseLimit??100)){S.pendingVoids=S.pendingVoids||[];S.pendingVoids.push({id:uid(),rid:r.id,k,iid,what,by:cur.name,at:new Date().toISOString()});log(`Asked the manager to approve reversing ${what} for ${r.name}.`);close();return toast('Sent to the manager to approve')}
      it.void=true;log(`Reversed ${what} for ${r.name} (Unit ${r.unit}).`);toast('Entry reversed');ledger(r.id);if(view==='rent')showScreen('rent')};
  });
}

function readPhoto(file,cb){if(!file)return;const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,480/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};img.src=fr.result};fr.readAsDataURL(file)}

// ---------- shared helpers (round 5) ----------
const bldgOf=u=>{const r=S.residents.find(x=>x.unit===u);return r?r.bldg:({1:'A',2:'B',3:'C',4:'D',5:'E'}[String(u)[0]]||'Common')};
const planOfUnit=u=>S.floorPlans.find(f=>String(f.units).split(',').map(x=>x.trim()).includes(u));
const marketRent=u=>(planOfUnit(u)||{}).rent||0;
function suggestRent(r){const m=marketRent(r.unit),cap=r.rent*(1+S.settings.maxIncreasePct/100);return Math.round(Math.max(r.rent,Math.min(cap,m||r.rent))/5)*5}
function agingOf(r){let credit=r.payments.filter(q=>!q.void).reduce((a,q)=>a+q.amt,0);const out={d30:0,d60:0,d90:0,total:0};
  [...r.charges.filter(c=>!c.void)].sort((a,b)=>a.date.localeCompare(b.date)).forEach(c=>{if(c.amt<0){credit-=c.amt;return}const used=Math.min(credit,c.amt);credit-=used;const left=Math.round((c.amt-used)*100)/100;if(left<=0)return;const age=-daysUntil(c.date);if(age<=30)out.d30+=left;else if(age<=60)out.d60+=left;else out.d90+=left});
  out.total=Math.round((out.d30+out.d60+out.d90)*100)/100;return out}
function occupancy(){const vac=S.turns.filter(t=>t.status==='active'||t.status==='ready').map(t=>t.unit).filter(u=>!S.residents.some(r=>r.unit===u));let units=S.residents.length+new Set(vac).size;
  const at=n=>{const occ=S.residents.filter(r=>!(r.renewal!=='Renewed'&&daysUntil(r.leaseEnd)<=n)).length;return {occ,pct:Math.round(occ/(units||1)*100)}};units=units||1;return {units,now:at(-1),d30:at(30),d60:at(60),d90:at(90)}}
const yearPct=()=>(T-new Date(Y,0,1))/(new Date(Y+1,0,1)-new Date(Y,0,1))*100;
function budgetRows(){const yr=String(Y);return Object.entries(S.budget).map(([cat,budget])=>{let actual=S.bills.filter(b=>b.status==='Paid'&&(b.paid||'').startsWith(yr)&&b.cat===cat).reduce((a,b)=>a+b.amt,0);
  if(cat==='Supplies')actual+=S.workOrders.reduce((a,w)=>a+((w.doneDate||'').startsWith(yr)?(w.parts||[]).reduce((q,x)=>q+x.cost,0):0),0);return {cat,budget,actual,pct:budget?actual/budget*100:0}})}
const WO_TPL=[['Toilet running nonstop','Normal','Toilet flapper'],['No air conditioning','Urgent','AC filter 20x25'],['Clogged kitchen drain','Normal',''],['Garbage disposal jammed','Normal',''],['Water leak','Urgent','',1],['No hot water','Urgent',''],['Gas smell','Emergency','',1],['Smoke detector chirping','Low','Smoke detector'],['Lockout','Normal',''],['Breaker keeps tripping','Urgent','',1],['Roof leak','Urgent','',1]];
const SAFETY=[[/gas/i,['Gas turned off at the shutoff valve','Area checked with a gas detector before and after']],[/electric|breaker|outlet|panel|wiring|gfci/i,['Breaker turned off and tagged','Wires tested dead with a voltage tester']],[/roof|ladder|gutter/i,['Ladder footed and tied off','Fall protection used above 6 feet']],[/water heater|pilot/i,['Water and gas or power shut off first','Relief valve checked after the repair']]];
function safetyHtml(w){const steps=SAFETY.filter(([re])=>re.test(w.problem)).flatMap(x=>x[1]);if(!steps.length)return '';
  return `<label>Safety checklist (required)</label><div class="list">${steps.map((t,i)=>`<label class="row" style="margin:0;font-weight:400;cursor:pointer"><input type="checkbox" class="sfchk" style="width:20px;height:20px"><div class="main">${esc(t)}</div></label>`).join('')}</div>`}

function parseCSV(text){const rows=[];let row=[],f='',q=false;text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','||c==='\t'){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows}
const toISO=v=>{v=String(v||'').trim();let m;if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;if(m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/)){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`}return ''};
const toNum=v=>{v=String(v||'').trim();const neg=/^\(.*\)$/.test(v)||/^-/.test(v);const n=parseFloat(v.replace(/[^0-9.]/g,''));return isNaN(n)?NaN:(neg?-n:n)};

  workorders:{label:'Open work orders',fields:[['unit','Unit',1,/^(unit|apt|location)$/i],['problem','Problem',1,/^(problem|description|issue|request|details)$/i],['priority','Priority',0,/^(priority|urgency)$/i],['created','Date created',0,/^(created|date|date created|opened|submitted)$/i]]}};

function loadImport(text,name){const rows=parseCSV(text);if(rows.length<2)return toast("That file doesn't have a header row and data. Check it and try again.");
  const K=IMPORT_KINDS[imp.kind],heads=rows[0].map(h=>h.trim());imp.rows=rows;imp.fileName=name;imp.map={};
  const saved=(S.importMaps||{})[imp.kind]||{};
  K.fields.forEach(([k,,,re])=>{const sv=saved[k];const i=sv!=null&&heads.indexOf(sv)>=0?heads.indexOf(sv):heads.findIndex(h=>re.test(h));imp.map[k]=i});
  showScreen('import')}
function importCheck(){const K=IMPORT_KINDS[imp.kind],data=imp.rows.slice(1),get=(r,k)=>imp.map[k]>=0?(r[imp.map[k]]||'').trim():'';const seen=new Set(S.residents.map(r=>r.unit));const out=[];
  data.forEach((r,i)=>{const rec={},probs=[];K.fields.forEach(([k,l,req])=>{rec[k]=get(r,k);if(req&&!rec[k])probs.push(`Missing ${l.toLowerCase()}`)});
    if(imp.kind==='residents'){if(rec.unit&&seen.has(rec.unit))probs.push(`Unit ${rec.unit} already has a resident`);if(rec.unit)seen.add(rec.unit);
      ['rent','balance','deposit'].forEach(k=>{if(rec[k]&&isNaN(toNum(rec[k])))probs.push(`${k} is not a number`)});if(rec.leaseEnd&&!toISO(rec.leaseEnd))probs.push('Lease end date not readable')}
    if(imp.kind==='workorders'&&rec.created&&!toISO(rec.created))probs.push('Date not readable');
    out.push({line:i+2,rec,probs})});return out}
function renderImportStep(){const K=IMPORT_KINDS[imp.kind],heads=imp.rows[0];const chk=importCheck(),bad=chk.filter(x=>x.probs.length),good=chk.length-bad.length;

  <h2>Step 3 · Check before saving</h2><p style="font-size:14px"><span class="pill p-good">${good} ready</span> ${bad.length?`<span class="pill p-bad">${bad.length} need attention</span> These rows will be skipped. Fix them in the spreadsheet and import again.`:''}</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--line)"><thead><tr style="text-align:left;color:var(--muted)"><th style="padding:8px">Row</th>${K.fields.filter(([k])=>imp.map[k]>=0).map(([,l])=>`<th style="padding:8px">${l}</th>`).join('')}<th style="padding:8px">Status</th></tr></thead><tbody>${chk.slice(0,25).map(x=>`<tr style="border-top:1px solid var(--line)"><td style="padding:8px" class="num">${x.line}</td>${K.fields.filter(([k])=>imp.map[k]>=0).map(([k])=>`<td style="padding:8px">${esc(x.rec[k])}</td>`).join('')}<td style="padding:8px">${x.probs.length?`<span style="color:var(--bad)">${esc(x.probs.join('; '))}</span>`:'<span style="color:var(--good)">OK</span>'}</td></tr>`).join('')}</tbody></table></div>${chk.length>25?`<p style="font-size:13px;color:var(--muted)">Showing the first 25 of ${chk.length} rows.</p>`:''}
  <div class="actions" style="margin-top:12px"><button class="btn" id="icancel2">Start over</button><button class="btn pri big" id="igo2" ${good?'':'disabled'}>Import ${good} ${K.label.toLowerCase()}</button></div>`;

function prospectStep_base(x){
  const set=(st,msg)=>{x.stage=st;log(`${x.name}: ${msg}`);close();toast(msg);render()};
  const body={
    'Lead':`<p>Schedule a tour of the unit.</p><label for="tdate">Tour date</label><input id="tdate" type="date" value="${addDays(2)}"><div class="actions"><button class="btn" id="plost">Not interested</button><button class="btn pri" id="pgo">Schedule tour</button></div>`,
    'Tour scheduled':`<p>Tour on ${fmtD(x.tour)}. After the tour, mark whether they applied.</p><div class="actions"><button class="btn" id="plost">Not interested</button><button class="btn pri" id="pgo">They applied</button></div>`,
    'Applied':`<p>Run screening with the same rules for every applicant: income, rental history and background.</p><div class="note" style="border-color:var(--accent);background:var(--soft)">Demo only. The real version connects to a screening company, and the applicant must give written permission.</div>${x.screening?`<p>Result: <b>${esc(x.screening)}</b></p><div class="actions"><button class="btn dang" id="plost">Deny</button><button class="btn pri" id="pgo">Approve</button></div>`:'<div class="actions"><button class="btn" id="plost">Withdrawn</button><button class="btn pri" id="pscr">Run screening</button></div>'}`,
    'Approved':`<p>Send the lease to sign from their phone.</p><label for="lrent">Monthly rent</label><input id="lrent" inputmode="decimal" value="1150"><label for="ldep">Security deposit</label><input id="ldep" inputmode="decimal" value="500"><label for="lstart">Move-in date</label><input id="lstart" type="date" value="${addDays(14)}"><div class="actions"><button class="btn" id="plost">Withdrawn</button><button class="btn pri" id="pgo">Send lease</button></div>`,
    'Lease sent':`<p>Lease sent: ${money(x.lease?.rent||0)} a month starting ${x.lease?fmtD(x.lease.start):''}. When they sign, they become a resident.</p><label for="lsig">Demo: applicant types their name to sign</label><input id="lsig" placeholder="${esc(x.name)}"><p id="lsigerr" style="color:var(--bad);font-size:13px;margin:6px 0 0"></p><div class="actions"><button class="btn" id="plost">Withdrawn</button><button class="btn pri" id="pgo">Sign lease</button></div>`
  }[x.stage];
  if(!body)return modal(`<h3>${esc(x.name)}</h3><p>${x.stage==='Leased'?'Signed and moved to Residents.':'Marked as lost.'}</p><div class="actions"><button class="btn pri" data-close>Close</button></div>`);
  modal(`<h3>${esc(x.name)} · ${x.stage}</h3>${x.notes?`<p style="font-size:13px;color:var(--muted)">${esc(x.notes)}</p>`:''}${body}`,()=>{
    const lost=$('#plost');lost&&(lost.onclick=()=>set('Lost','Marked as lost'));
    const sc=$('#pscr');sc&&(sc.onclick=()=>{x.screening='Meets criteria · income 3.1x rent · no evictions found';log(`Screening run for ${x.name}.`);prospectStep(x)});
    const g=$('#pgo');g&&(g.onclick=()=>{
      if(x.stage==='Lead'){x.tour=$('#tdate').value;set('Tour scheduled','Tour scheduled for '+fmtD(x.tour))}

      else if(x.stage==='Applied')set('Approved','Application approved');
      else if(x.stage==='Approved'){x.lease={rent:parseFloat($('#lrent').value)||0,deposit:parseFloat($('#ldep').value)||0,start:$('#lstart').value};set('Lease sent','Lease sent to sign')}

// ---------- helpers ----------
function monday(d){const x=new Date(d+'T00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return isoD(x)}

// ---------- payment plans ----------
const planOf=r=>S.plans.find(x=>x.rid===r.id&&x.status==='active');
function planState(x){const r=resById(x.rid);const paid=r.payments.filter(q=>!q.void&&q.date>=x.created).reduce((a,q)=>a+q.amt,0);let cum=0;
  return x.items.map(i=>{cum+=i.amt;const ok=paid>=cum-0.005;return {...i,paid:ok,missed:!ok&&i.date<today}})}
function planForm(r){
  const ex=planOf(r);
  if(ex){const st=planState(ex);return modal(`<h3>Payment plan · ${esc(r.name)}</h3><p style="color:var(--muted);font-size:13px;margin:0">Started ${fmtD(ex.created)} · ${money(ex.total)} total</p><div class="list" style="margin-top:12px">${st.map(i=>`<div class="row"><div class="main"><div class="t">${fmtD(i.date)}</div></div><span class="money">${money(i.amt)}</span><span class="pill ${i.paid?'p-good':i.missed?'p-bad':'p-mute'}">${i.paid?'Paid':i.missed?'Missed':'Upcoming'}</span></div>`).join('')}</div><p style="font-size:13px;color:var(--muted)">Payments recorded after the plan started count toward it automatically.</p><div class="actions"><button class="btn dang" id="plend">End plan</button><button class="btn pri" data-close>Close</button></div>`,()=>{$('#plend').onclick=()=>{ex.status='ended';log(`Ended payment plan for ${r.name}.`);close();toast('Plan ended');render()}})}
  modal(`<h3>Payment plan · ${esc(r.name)}</h3><p style="color:var(--muted);font-size:13px;margin:0">Split what they owe into smaller payments. Late fees are not added automatically while the plan is active.</p>
  <label for="plt">Amount on the plan</label><input id="plt" inputmode="decimal" value="${Math.max(0,bal(r)).toFixed(2)}">
  <label for="pln">Number of payments</label><select id="pln"><option>2</option><option selected>3</option><option>4</option><option>6</option></select>
  <label for="ple">How often</label><select id="ple"><option>Every week</option><option selected>Every 2 weeks</option><option>Every month</option></select>
  <label for="plf">First payment date</label><input id="plf" type="date" value="${addDays(7)}">
  <div id="plprev" style="margin-top:10px"></div><p id="plerr" style="color:var(--bad);font-size:13px;margin:6px 0 0"></p>
  <div class="actions"><button class="btn" data-close>Cancel</button><button class="btn pri" id="plgo">Start plan</button></div>`,()=>{
    const build=()=>{const t=parseFloat($('#plt').value)||0,n=+$('#pln').value,step=$('#ple').value;const each=Math.floor(t/n*100)/100;let d=$('#plf').value;const out=[];
      for(let k=0;k<n;k++){out.push({date:d,amt:k===n-1?Math.round((t-each*(n-1))*100)/100:each});const x=new Date(d+'T00:00');if(step==='Every week')x.setDate(x.getDate()+7);else if(step==='Every 2 weeks')x.setDate(x.getDate()+14);else x.setMonth(x.getMonth()+1);d=isoD(x)}
      $('#plprev').innerHTML=`<div class="list">${out.map(i=>`<div class="row"><div class="main">${fmtD(i.date)}</div><span class="money">${money(i.amt)}</span></div>`).join('')}</div>`;return {t,out}};
    ['#plt','#pln','#ple','#plf'].forEach(k=>$(k).oninput=$(k).onchange=build);build();
    $('#plgo').onclick=()=>{const {t,out}=build();if(!(t>0))return $('#plerr').textContent='Enter an amount greater than $0.';S.plans.push({id:uid(),rid:r.id,total:t,items:out,created:today,status:'active'});log(`Started a ${out.length}-payment plan for ${r.name} (${money(t)}).`);close();toast('Payment plan started');render()};});
}

// ---------- deposits & bounced payments ----------
function depositReport(d){
  const rows=[];S.residents.forEach(r=>r.payments.forEach(q=>{if(!q.void&&q.date===d&&q.method!=='Online')rows.push({r,q})}));
  rows.sort((a,b)=>a.r.unit.localeCompare(b.r.unit));const tot=rows.reduce((a,x)=>a+x.q.amt,0);
  const table=`<div class="letter"><h3>Deposit report</h3><div style="color:var(--muted);font-size:13px">${esc(curProp.name)} · ${fmtD(d)}</div>${rows.map(x=>`<div style="display:flex;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0"><span>Unit ${esc(x.r.unit)} · ${esc(x.r.name)}<br><small style="color:var(--muted)">${esc(x.q.method)} #${esc(x.q.ref||'-')}</small></span><span class="num">${money(x.q.amt)}</span></div>`).join('')||'<p>No money orders or checks recorded this day.</p>'}<p style="text-align:right"><b>${rows.length} items · Total <span class="num">${money(tot)}</span></b></p></div>`;
  modal(`<h3>Deposit report</h3><label for="ddate">Day</label><input id="ddate" type="date" value="${d}" max="${today}"><div style="margin-top:12px">${table}</div>
  ${rows.length?`<p style="font-size:13px">${rows.every(x=>x.q.deposited)?'<span class="pill p-good">Deposited</span>':'<span class="pill p-warn">Not deposited yet</span>'}</p>`:''}
  <div class="actions"><button class="btn" data-close>Close</button>${rows.length?'<button class="btn" id="dprint">Print</button><button class="btn pri" id="ddone">Mark as deposited</button>':''}</div>`,()=>{
    $('#ddate').onchange=e=>depositReport(e.target.value);
    const pr=$('#dprint');pr&&(pr.onclick=()=>printHTML(table));
    const dd=$('#ddone');dd&&(dd.onclick=()=>{rows.forEach(x=>x.q.deposited=true);log(`Marked ${rows.length} payments (${money(tot)}) from ${fmtD(d)} as deposited.`);toast('Marked as deposited');depositReport(d)});});
}
function nsfForm(r,pid){const q=r.payments.find(x=>x.id===pid);
  modal(`<h3>Payment bounced?</h3><p>This reverses the ${money(q.amt)} ${esc(q.method.toLowerCase())}${q.ref?' #'+esc(q.ref):''} from ${esc(r.name)} and adds the returned-payment fee.</p>
  <label for="nsff">Returned-payment fee</label><input id="nsff" inputmode="decimal" value="${S.settings.nsfFee}">
  <p style="font-size:13px;color:var(--muted)">New balance: <b class="num" id="nsfb"></b></p>
  <div class="actions"><button class="btn" data-close>Cancel</button><button class="btn dang" id="nsfgo">Record bounced payment</button></div>`,()=>{
    const upd=()=>$('#nsfb').textContent=money(bal(r)+q.amt+(parseFloat($('#nsff').value)||0));$('#nsff').oninput=upd;upd();
    $('#nsfgo').onclick=()=>{const f=parseFloat($('#nsff').value)||0;q.void=true;q.bounced=true;if(f>0)r.charges.push({id:uid(),date:today,desc:'Returned payment fee',amt:f,void:false});log(`${q.method}${q.ref?' #'+q.ref:''} for ${money(q.amt)} from ${r.name} bounced${f?'; '+money(f)+' fee added':''}.`);toast('Bounced payment recorded');ledger(r.id);render()};});

// ---------- unit history ----------
function unitHistory_base(u){
  const units=[...new Set([...S.residents.map(r=>r.unit),...S.turns.map(t=>t.unit),...S.workOrders.filter(w=>/^\d/.test(w.unit)).map(w=>w.unit)])].sort();
  u=u||units[0];const wos=S.workOrders.filter(w=>w.unit===u),ins=S.inspections.filter(i=>i.unit===u),tr=S.turns.filter(t=>t.unit===u);
  const pc=wos.reduce((a,w)=>a+(w.parts||[]).reduce((b,x)=>b+x.cost,0),0);
  modal(`<h3>Unit history</h3><label for="uhu">Unit</label><select id="uhu">${units.map(x=>`<option ${x===u?'selected':''}>${esc(x)}</option>`).join('')}</select>
  <p style="font-size:14px">${wos.length} work orders · ${ins.length} inspections · Parts spent <b class="num">${money(pc)}</b></p>
  <div class="list">${[...wos.map(w=>({d:w.created,h:`<b>${esc(w.problem)}</b><div class="m">${w.id} · ${w.status}${(w.parts||[]).length?' · parts '+money(w.parts.reduce((b,x)=>b+x.cost,0)):''}</div>`})),...ins.map(i=>({d:i.date,h:`<b>${i.type} inspection</b><div class="m">by ${esc(i.by)}${i.charge?' · '+money(i.charge)+' charged':''}</div>`})),...tr.map(t=>({d:t.moveOut,h:`<b>Make ready</b><div class="m">${t.status==='ready'?'Finished':'In progress'}</div>`}))].sort((a,b)=>b.d.localeCompare(a.d)).map(x=>`<div class="row"><div class="main">${x.h}</div><span class="m" style="color:var(--muted)">${fmtD(x.d)}</span></div>`).join('')||'<div class="empty">Nothing on file for this unit yet.</div>'}</div>
  <div class="actions"><button class="btn pri" data-close>Close</button></div>`,()=>{$('#uhu').onchange=e=>unitHistory(e.target.value)});
}
function unitHistory(...a){const r=unitHistory_base(...a);runParts('unitHistory',a);return r}

// ---------- calendar ----------
VIEWS.calendar=()=>{
  const end=addDays(45),ev=[];
  S.residents.forEach(r=>{if(r.leaseEnd>=today&&r.leaseEnd<=end)ev.push({d:r.leaseEnd,k:'Lease ends',t:`${r.name}, Unit ${r.unit}`,c:'p-warn'})});
  S.turns.filter(t=>t.status==='active').forEach(t=>ev.push({d:t.readyBy,k:'Make ready',t:`Unit ${t.unit} must be ready`,c:'p-warn'}));
  S.recurring.filter(r=>!r.paused&&r.next<=end).forEach(r=>ev.push({d:r.next,k:'Scheduled',t:`${r.task} (${r.where})`,c:'p-mute'}));
  S.plans.filter(x=>x.status==='active').forEach(x=>planState(x).filter(i=>!i.paid&&i.date<=end).forEach(i=>{const r=resById(x.rid);ev.push({d:i.date,k:'Plan payment',t:`${r.name} owes ${money(i.amt)}`,c:i.missed?'p-bad':'p-mute'})}));
  S.prospects.filter(x=>x.tour&&x.tour>=today&&x.tour<=end&&x.stage==='Tour scheduled').forEach(x=>ev.push({d:x.tour,k:'Tour',t:`${x.name}${x.unit?' · Unit '+x.unit:''}`,c:'p-good'}));
  S.reservations.filter(x=>x.status!=='Canceled'&&x.date>=today&&x.date<=end).forEach(x=>ev.push({d:x.date,k:x.amenity,t:`${x.name} · ${x.time}`,c:'p-mute'}));
  S.deposits.filter(d=>d.status==='Due').forEach(d=>{const due=addDaysFrom(d.moveOut,30);if(due<=end)ev.push({d:due<today?today:due,k:'Deposit due',t:`Refund or itemized list for ${d.name}`,c:'p-bad'})});
  S.bills.filter(x=>x.status==='Unpaid'&&x.due<=end).forEach(x=>ev.push({d:x.due<today?today:x.due,k:'Bill due',t:`${x.vendor} · ${money(x.amt)}`,c:x.due<today?'p-bad':'p-mute'}));
  S.residents.filter(r=>r.notice&&r.notice.moveOut>=today&&r.notice.moveOut<=end).forEach(r=>ev.push({d:r.notice.moveOut,k:'Move-out',t:`${r.name}, Unit ${r.unit}`,c:'p-warn'}));
  (S.compliance||[]).filter(c=>c.next&&c.next<=end).forEach(c=>ev.push({d:c.next<today?today:c.next,k:'Compliance',t:c.name+(c.next<today?' (overdue)':''),c:c.next<today?'p-bad':'p-warn'}));
  S.events.filter(e=>e.date>=today&&e.date<=end).forEach(e=>ev.push({d:e.date,k:e.kind,t:e.title,c:'p-good',id:e.id}));
  ev.sort((a,b)=>a.d.localeCompare(b.d));const days=[...new Set(ev.map(e=>e.d))];
  $('#view').innerHTML=`<h1>Calendar</h1><p class="sub">The next 45 days: lease endings, make-ready deadlines, scheduled maintenance, payment plan dates and your events.</p><div class="toolbar"><button class="btn pri" id="caladd">Add an event</button></div>
  <div id="calist">${days.map(d=>`<h2 style="font-size:15px;margin:18px 0 8px">${new Date(d+'T00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}${d===today?' · Today':''}</h2><div class="list">${ev.filter(e=>e.d===d).map(e=>`<div class="row"><span class="pill ${e.c}">${esc(e.k)}</span><div class="main"><div class="t" style="font-weight:500">${esc(e.t)}</div></div>${e.id?`<button class="btn" data-evdel="${e.id}">Remove</button>`:''}</div>`).join('')}</div>`).join('')||'<div class="empty">Nothing coming up.</div>'}</div>`;
  $('#caladd').onclick=()=>modal(`<h3>Add an event</h3><label for="evt">What's happening?</label><input id="evt" placeholder="e.g. Fire alarm inspection"><label for="evd">Date</label><input id="evd" type="date" value="${addDays(7)}"><label for="evk">Type</label><select id="evk"><option>Event</option><option>Vendor visit</option><option>Inspection</option><option>Move-in</option><option>Move-out</option><option>Other</option></select><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn pri" id="evgo">Add event</button></div>`,()=>{$('#evgo').onclick=()=>{const t=$('#evt').value.trim();if(!t)return toast('Describe the event');S.events.push({id:uid(),date:$('#evd').value,title:t,kind:$('#evk').value});log(`Added calendar event: ${t} on ${fmtD($('#evd').value)}.`);close();showScreen('calendar')}});
  document.querySelectorAll('[data-evdel]').forEach(b=>b.onclick=()=>{S.events=S.events.filter(e=>e.id!==b.dataset.evdel);log('Removed a calendar event.');showScreen('calendar')});
};

  <label for="mtext">Message</label><textarea id="mtext" rows="4" placeholder="e.g. Water will be off in Building B tomorrow from 9 AM to noon."></textarea>
  <p id="mcount" style="font-size:13px;color:var(--muted)"></p><div class="actions"><button class="btn pri" id="msend">Send message</button></div></div>
  <h2>Sent</h2><div class="list">${S.messages.map(m=>`<div class="row"><div class="main"><div class="t" style="font-weight:500">${esc(m.text)}</div><div class="m">To ${esc(m.label)} · ${m.sent} sent${m.print?' · '+m.print+' need a printed copy':''} · ${new Date(m.t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div></div></div>`).join('')||'<div class="empty">No messages sent yet.</div>'}</div>`;
  const pick=()=>{const v=$('#mto').value;return S.residents.filter(r=>v==='all'||(v.startsWith('b:')&&r.bldg===v.slice(2))||(v==='owe'&&bal(r)>0)||(v==='ren'&&daysUntil(r.leaseEnd)<=60))};
  const cnt=()=>{const l=pick(),np=l.filter(r=>!r.phone&&!r.email);$('#mcount').innerHTML=`${l.length} residents · ${l.length-np.length} by text or email${np.length?` · ${np.length} need a printed copy (${np.map(r=>'Unit '+esc(r.unit)).join(', ')})`:''}`};
  $('#mto').onchange=cnt;cnt();
  $('#msend').onclick=()=>{const t=$('#mtext').value.trim();if(!t)return toast('Type a message first');const l=pick(),np=l.filter(r=>!r.phone&&!r.email).length;const label=$('#mto').selectedOptions[0].textContent;
    S.messages.unshift({id:uid(),text:t,label,sent:l.length-np,print:np,t:new Date().toISOString()});l.forEach(r=>S.notify.push({rid:r.id,t:new Date().toISOString(),text:'From the office: '+t}));
    log(`Sent a message to ${label} (${l.length-np} by text/email${np?', '+np+' to print':''}).`);toast(`Sent to ${l.length-np} residents`);showScreen('messages')};
};

// ---------- reports ----------
VIEWS.report=()=>{
  const mk=today.slice(0,7),inM=d=>d&&d.slice(0,7)===mk;
  let rent=0,coll=0,late=0,nsf=0;S.residents.forEach(r=>{r.charges.filter(c=>!c.void&&inM(c.date)).forEach(c=>{if(/rent/i.test(c.desc))rent+=c.amt;if(c.late)late+=c.amt;if(/returned/i.test(c.desc))nsf+=c.amt});r.payments.filter(q=>!q.void&&inM(q.date)).forEach(q=>coll+=q.amt)});
  const owed=S.residents.reduce((a,r)=>a+Math.max(0,bal(r)),0);
  const created=S.workOrders.filter(w=>inM(w.created)).length,done=S.workOrders.filter(w=>w.status==='Complete'&&inM(w.doneDate||w.created));
  const days=w=>Math.max(0,Math.round((new Date((w.doneDate||today)+'T00:00')-new Date(w.created+'T00:00'))/864e5));
  const avg=a=>a.length?(a.reduce((x,w)=>x+days(w),0)/a.length).toFixed(1):'-';
  const parts=S.workOrders.reduce((a,w)=>a+(inM(w.doneDate)?(w.parts||[]).reduce((b,x)=>b+x.cost,0):0),0);
  const pct=n=>rent?Math.round(Math.min(n,rent)/rent*100)+'%':'-';
  const tech=S.techs.map(t=>{const mine=S.workOrders.filter(w=>w.assignee===t);const c=mine.filter(w=>w.status==='Complete');return {t,c:c.length,open:mine.filter(w=>w.status==='Assigned').length,avg:avg(c),parts:c.reduce((a,w)=>a+(w.parts||[]).reduce((b,x)=>b+x.cost,0),0),hrs:hrs(t)}});
  setTimeout(()=>{const b=$('#rroll');b&&(b.onclick=rentRoll)},0);
  const occ=occupancy(),del=S.residents.map(r=>({r,a:agingOf(r)})).filter(x=>x.a.total>0).sort((a,b)=>b.a.total-a.a.total);
  const occHtml=`<h2>Occupancy forecast</h2><div class="list">${[['Today',occ.now],['In 30 days',occ.d30],['In 60 days',occ.d60],['In 90 days',occ.d90]].map(([l,v])=>`<div class="row"><div class="main" style="flex:0 1 110px">${l}</div><div class="meter"><i style="width:${v.pct}%"></i></div><span class="money">${v.pct}%</span><span class="m" style="color:var(--muted);font-size:13px;min-width:120px">${v.occ} of ${occ.units} units</span></div>`).join('')}</div><p style="font-size:13px;color:var(--muted)">Counts leases ending without a signed renewal as move-outs, and vacant units as staying empty.</p>
  <h2>Delinquency</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line)"><thead><tr style="text-align:left;color:var(--muted)"><th style="padding:10px">Resident</th><th>0–30 days</th><th>31–60</th><th>61+</th><th>Total</th></tr></thead><tbody>${del.map(x=>`<tr style="border-top:1px solid var(--line)"><td style="padding:10px">${esc(x.r.name)} · ${esc(x.r.unit)}</td><td class="num">${money(x.a.d30)}</td><td class="num" style="${x.a.d60?'color:var(--warn)':''}">${money(x.a.d60)}</td><td class="num" style="${x.a.d90?'color:var(--bad)':''}">${money(x.a.d90)}</td><td class="num"><b>${money(x.a.total)}</b></td></tr>`).join('')||'<tr><td style="padding:10px" colspan="5">Nobody owes money.</td></tr>'}</tbody></table></div>`;
  $('#view').innerHTML=`<div class="toolbar" style="float:right"><button class="btn" id="rroll">Rent roll</button></div><h1>${monthName} report</h1><p class="sub">${esc(curProp.name)}, month to date. In the online version this is emailed to the owner on the 1st of each month.</p>
  <div class="stats"><div class="stat" style="cursor:default"><b class="num">${pct(coll)}</b><span>of rent collected (${money(coll)} of ${money(rent)})</span></div><div class="stat" style="cursor:default"><b class="num">${money(owed)}</b><span>still owed</span></div><div class="stat" style="cursor:default"><b class="num">${done.length}</b><span>work orders finished of ${created} opened</span></div><div class="stat" style="cursor:default"><b class="num">${avg(done)}</b><span>average days to finish a job</span></div></div>
  ${occHtml}
  <h2>Money</h2><div class="list">${[['Rent charged',money(rent)],['Collected',money(coll)],['Late fees charged',money(late)],['Returned-payment fees',money(nsf)],['Active payment plans',S.plans.filter(x=>x.status==='active').length],['Parts spent on repairs',money(parts)]].map(([a,b])=>`<div class="row"><div class="main">${a}</div><span class="money">${b}</span></div>`).join('')}</div>
  <h2>Residents</h2><div class="list">${(()=>{const rated=S.workOrders.filter(w=>w.rating);return [['Repair rating from residents',rated.length?(rated.reduce((a,w)=>a+w.rating,0)/rated.length).toFixed(1)+' of 5 ('+rated.length+' ratings)':'No ratings yet'],['Lease violations this month',S.violations.filter(v=>inM(v.date)).length],['Evictions in progress',S.evictions.filter(e=>e.status==='Open').length],['New leases signed',S.prospects.filter(x=>x.stage==='Leased').length]].map(([a,b])=>`<div class="row"><div class="main">${a}</div><span class="money">${b}</span></div>`).join('')})()}</div>
  <h2>Leasing and turns</h2><div class="list">${[['Renewal offers sent',S.residents.filter(r=>r.renewal!=='Not sent').length],['Renewals signed',S.residents.filter(r=>r.renewal==='Renewed').length],['Not renewing',S.residents.filter(r=>r.renewal==='Not renewing').length],['Units made ready',S.turns.filter(t=>t.status==='ready').length],['Units still being turned',S.turns.filter(t=>t.status==='active').length]].map(([a,b])=>`<div class="row"><div class="main">${a}</div><span class="money">${b}</span></div>`).join('')}</div>
  <h2>Maintenance team</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px"><thead><tr style="text-align:left;color:var(--muted)"><th style="padding:10px">Tech</th><th>Finished</th><th>Open now</th><th>Avg days</th><th>Parts</th><th>Hours today</th><th>Avg job time</th><th>Rating</th></tr></thead><tbody>${tech.map(x=>`<tr style="border-top:1px solid var(--line)"><td style="padding:10px;font-weight:600">${esc(x.t)}</td><td class="num">${x.c}</td><td class="num">${x.open}</td><td class="num">${x.avg}</td><td class="num">${money(x.parts)}</td><td class="num">${x.hrs}</td><td class="num">${(()=>{const a=S.workOrders.filter(w=>w.assignee===x.t&&w.minutes);return a.length?Math.round(a.reduce((q,w)=>q+w.minutes,0)/a.length)+' min':'-'})()}</td><td class="num">${(()=>{const a=S.workOrders.filter(w=>w.assignee===x.t&&w.rating);return a.length?(a.reduce((q,w)=>q+w.rating,0)/a.length).toFixed(1)+'★':'-'})()}</td></tr>`).join('')}</tbody></table></div>`;
};

// ---------- settings, export, support ----------
VIEWS.settings=()=>{
  const P=S.settings.perm;const T=[['techSeeResident','Techs can see the resident\'s name and phone on their work orders'],['techCreateWO','Techs can create work orders from their phone'],['photosUrgent','Require before and after photos on urgent jobs'],['acceptCash','Accept cash payments']];
  $('#view').innerHTML=`<h1>Settings</h1><p class="sub">Decide what your team can see and do, set fees, and keep a copy of your data.</p>

  <h2>Online rent payments</h2><div class="list"><label class="row" style="margin:0;font-weight:400;cursor:pointer"><div class="main"><div class="t" style="font-weight:500">Let residents pay online</div><div class="m">Bank payments are free for residents. Card payments add a fee that goes to the payment processor.</div></div><input type="checkbox" id="sop" ${S.settings.onlinePay?'checked':''} style="width:22px;height:22px"></label><div class="row"><div class="main"><div class="t" style="font-weight:500">Card fee (%)</div></div><input id="scf" inputmode="decimal" value="${S.settings.cardFeePct}" style="width:100px" aria-label="Card fee percent"></div></div>
  <h2>Monthly fees</h2><div class="list" id="feetypes">${S.feeTypes.map((f,i)=>`<div class="row"><div class="main"><div class="t" style="font-weight:500">${esc(f.name)}</div></div><span class="money">${money(f.amt)}</span><button class="btn" data-fdel="${i}">Remove</button></div>`).join('')}<div class="row"><input id="nfn" placeholder="Fee name, e.g. Valet trash" style="flex:2 1 160px" aria-label="Fee name"><input id="nfa" placeholder="$" inputmode="decimal" style="flex:1 1 70px" aria-label="Fee amount"><button class="btn" id="nfadd">Add fee</button></div></div>
  <h2>Spending and security</h2><div class="list"><div class="row"><div class="main"><div class="t" style="font-weight:500">Purchase orders above this amount need owner approval</div></div><input id="sal" inputmode="decimal" value="${S.settings.approvalLimit}" style="width:100px" aria-label="Approval limit"></div>
  <label class="row" style="margin:0;font-weight:400;cursor:pointer"><div class="main"><div class="t" style="font-weight:500">Managers and owners confirm sign-in with a texted code</div></div><input type="checkbox" id="s2s" ${S.settings.twoStep?'checked':''} style="width:22px;height:22px"></label></div>
  <h2>Office hours</h2><div class="list"><div class="row" style="display:block"><label for="shrs" style="margin:0 0 4px">Hours residents see</label><input id="shrs" value="${esc(S.settings.hours||'Mon–Fri 9 AM–6 PM · Sat 10 AM–4 PM · Closed Sunday')}"></div>
  <div class="row" style="display:block"><label for="shol" style="margin:0 0 4px">Holidays the office is closed (dates, comma separated)</label><input id="shol" value="${esc(S.settings.holidays||`${Y}-11-26, ${Y}-12-24, ${Y}-12-25, ${Y+1}-01-01`)}" placeholder="YYYY-MM-DD"></div>
  <div class="row"><div class="main"><div class="t" style="font-weight:500">Reversals above this amount by an assistant manager need the manager's OK</div></div><input id="srev" inputmode="decimal" value="${S.settings.reverseLimit??100}" style="width:100px" aria-label="Reversal approval limit"></div></div>
  <h2>Automatic priority</h2><p class="sub" style="margin-bottom:8px">When a work order mentions one of these words, its priority is raised automatically and it moves to the top. Separate words with commas.</p>
  <div class="list"><label class="row" style="margin:0;font-weight:400;cursor:pointer"><div class="main"><div class="t" style="font-weight:500">Raise priority automatically</div></div><input type="checkbox" id="sap" ${S.settings.autoPrio===false?'':'checked'} style="width:22px;height:22px"></label>
  ${['Emergency','Urgent'].map(lv=>`<div class="row" style="display:block"><label for="pr-${lv}" style="margin:0 0 4px"><span class="pill ${lv==='Emergency'?'p-bad':'p-warn'}">${lv}</span></label><textarea id="pr-${lv}" rows="3" style="font-size:13px">${esc((S.settings.prioRules||PRIO_DEFAULT)[lv])}</textarea></div>`).join('')}
  <div class="row"><div class="main"><div class="m">Emergencies go straight to the on-call tech. Urgent jobs go to the top of every list.</div></div><button class="btn" id="prsave">Save words</button><button class="btn" id="prreset">Reset</button></div></div>
  <h2>Renewals and emergencies</h2><div class="list"><div class="row"><div class="main"><div class="t" style="font-weight:500">Largest renewal increase to suggest (%)</div></div><input id="smax" inputmode="decimal" value="${S.settings.maxIncreasePct}" style="width:100px" aria-label="Largest increase percent"></div>
  <div class="row"><div class="main"><div class="t" style="font-weight:500">After-hours emergency line</div><div class="m">Residents call this number. Calls and emergency work orders go to whoever is on call this week (${esc(oncallNow()||'not set')}).</div></div><input id="sah" value="${esc(S.settings.afterHours)}" style="width:150px" aria-label="After-hours number"></div></div>
  <h2>Floor plans</h2><div class="list">${S.floorPlans.map(f=>`<div class="row"><div class="main"><div class="t" style="font-weight:500">${esc(f.name)}</div><div class="m">${f.sqft} sq ft · Units ${esc(String(f.units).split(',').join(', '))}</div></div><span class="money">${money(f.rent)}</span><button class="btn" data-fp="${f.id}">Edit</button></div>`).join('')}</div><div class="actions" style="justify-content:flex-start;margin-top:8px"><button class="btn" id="fpadd">Add a floor plan</button></div>
  <h2>Your data</h2><p class="sub" style="margin-bottom:10px">Your data always belongs to the property. Download a copy any time. The online version also backs everything up automatically every day.</p>
  <div class="actions"><button class="btn" id="exr">Residents and balances (spreadsheet)</button><button class="btn" id="exw">Work orders (spreadsheet)</button><button class="btn" id="exj">Full backup</button></div>
  <h2>Support messages</h2><div class="list">${S.support.map(m=>`<div class="row"><div class="main"><div class="t" style="font-weight:500">${esc(m.text)}</div><div class="m">${esc(m.who)} · on the ${esc(m.screen)} screen · ${new Date(m.t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div></div><span class="pill p-mute">Sent</span></div>`).join('')||'<div class="empty">No support messages sent.</div>'}</div>`;
  document.querySelectorAll('[data-perm]').forEach(x=>x.onchange=()=>{P[x.dataset.perm]=x.checked;log(`${x.checked?'Turned on':'Turned off'}: ${T.find(t=>t[0]===x.dataset.perm)[1]}.`);toast('Saved');save()});
  $('#slate').onclick=settingsForm;
  $('#shrs').onchange=e=>{S.settings.hours=e.target.value.trim();log('Updated office hours.');toast('Saved');save()};
  $('#shol').onchange=e=>{S.settings.holidays=e.target.value.trim();log('Updated office holidays.');toast('Saved');save()};
  $('#srev').onchange=e=>{const v=parseFloat(e.target.value);if(v>=0){S.settings.reverseLimit=v;log(`Reversals over ${money(v)} by an assistant now need approval.`);toast('Saved');save()}};
  $('#sap').onchange=e=>{S.settings.autoPrio=e.target.checked;log(`Automatic priority turned ${e.target.checked?'on':'off'}.`);toast('Saved');save()};
  $('#prsave').onclick=()=>{S.settings.prioRules={Emergency:$('#pr-Emergency').value,Urgent:$('#pr-Urgent').value};S.workOrders.forEach(w=>w.prioChecked=false);log('Updated automatic priority words.');toast('Saved. Open work orders were rechecked.');render()};
  $('#prreset').onclick=()=>{delete S.settings.prioRules;S.workOrders.forEach(w=>w.prioChecked=false);log('Reset automatic priority words.');render()};
  $('#smax').onchange=e=>{const v=parseFloat(e.target.value);if(v>=0){S.settings.maxIncreasePct=v;log(`Largest suggested renewal increase set to ${v}%.`);toast('Saved');save()}};
  $('#sah').onchange=e=>{S.settings.afterHours=e.target.value.trim();log('Updated after-hours emergency line.');toast('Saved');save()};
  const fpForm=f=>formModal(f?'Edit floor plan':'Add a floor plan',[['name','Name','text',f?f.name:'',null,1],['sqft','Square feet','money',f?f.sqft:''],['rent','Market rent','money',f?f.rent:'',null,1],['units','Units with this plan (comma separated)','text',f?f.units:'']],v=>{if(f)Object.assign(f,v);else S.floorPlans.push({id:uid(),...v});log(`Saved floor plan ${v.name}.`)});
  $('#fpadd').onclick=()=>fpForm(null);document.querySelectorAll('[data-fp]').forEach(b=>b.onclick=()=>fpForm(S.floorPlans.find(f=>f.id===b.dataset.fp)));
  const sv=(k,v,msg)=>{S.settings[k]=v;log(msg);toast('Saved');save()};
  $('#sop').onchange=e=>sv('onlinePay',e.target.checked,`Online payments turned ${e.target.checked?'on':'off'}.`);
  $('#s2s').onchange=e=>sv('twoStep',e.target.checked,`Texted sign-in codes turned ${e.target.checked?'on':'off'}.`);
  $('#scf').onchange=e=>{const v=parseFloat(e.target.value);if(v>=0)sv('cardFeePct',v,`Card fee set to ${v}%.`)};
  $('#sal').onchange=e=>{const v=parseFloat(e.target.value);if(v>=0)sv('approvalLimit',v,`Owner approval required above ${money(v)}.`)};
  $('#nfadd').onclick=()=>{const n=$('#nfn').value.trim(),a=parseFloat($('#nfa').value);if(!n||!(a>0))return toast('Enter a fee name and amount');S.feeTypes.push({name:n,amt:a});log(`Added monthly fee: ${n} ${money(a)}.`);showScreen('settings')};
  document.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=()=>{const f=S.feeTypes.splice(+b.dataset.fdel,1)[0];log(`Removed monthly fee: ${f.name}.`);showScreen('settings')});
  $('#snsf').onchange=e=>{const v=parseFloat(e.target.value);if(v>=0){S.settings.nsfFee=v;log(`Returned-payment fee set to ${money(v)}.`);toast('Saved');save()}};
  const csv=rows=>rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  $('#exr').onclick=()=>exportFile('residents.csv',csv([['Unit','Building','Name','Phone','Email','Rent','Balance','Lease ends','Emergency contact','Vehicles','Pets'],...S.residents.map(r=>[r.unit,r.bldg,r.name,r.phone,r.email,r.rent,bal(r).toFixed(2),r.leaseEnd,r.emergency,r.vehicles,r.pets])]));
  $('#exw').onclick=()=>exportFile('work-orders.csv',csv([['ID','Unit','Problem','Priority','Status','Assigned to','Created','Finished','Parts cost'],...S.workOrders.map(w=>[w.id,w.unit,w.problem,w.priority,w.status,who(w.assignee),w.created,w.doneDate||'',(w.parts||[]).reduce((a,x)=>a+x.cost,0)])]));
  $('#exj').onclick=()=>exportFile('doorline-backup.json',JSON.stringify(S));
};
function exportFile(name,text){
  if(!isFramed()){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();log(`Downloaded ${name}.`);return toast('Downloaded '+name)}
  modal(`<h3>${esc(name)}</h3><p style="font-size:14px;color:var(--muted)">This preview can't save files. Copy the text below, or open the computer version of Doorline to download it.</p><textarea id="exta" rows="8" readonly style="font-family:var(--mono);font-size:12px">${esc(text.slice(0,200000))}</textarea><div class="actions"><button class="btn" data-close>Close</button><button class="btn pri" id="excp">Copy</button></div>`,()=>{
    $('#excp').onclick=()=>{const ta=$('#exta');try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copied'),()=>{ta.select();toast('Selected. Press Ctrl+C to copy.')})}catch(e){ta.select();toast('Selected. Press Ctrl+C to copy.')}}});
}
function supportForm(){
  modal(`<h3>Message support</h3><p style="font-size:14px;color:var(--muted);margin:0">Tell us what you were trying to do. We'll see which screen you were on.</p><label for="supt">What's going on?</label><textarea id="supt" rows="4"></textarea><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn pri" id="supgo">Send</button></div>`,()=>{
    $('#supgo').onclick=()=>{const t=$('#supt').value.trim();if(!t)return toast('Type your question first');S.support.unshift({who:cur.name,screen:(([...MGR_TABS,['mywo','My work orders'],['home','My home'],['portfolio','Portfolio']].find(x=>x[0]===view)||[0,view])[1]),text:t,t:new Date().toISOString()});save();close();toast('Sent. Support will reply by text or email.')};});

const RADIUS_FT=500;

const clkTime=t=>new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const dist=ft=>ft<5280?ft+' ft':(ft/5280).toFixed(1)+' mi';
function hrs(n){let ms=0,start=null;S.clock.filter(c=>c.who===n&&c.t.slice(0,10)===today).sort((a,b)=>a.t.localeCompare(b.t)).forEach(c=>{if(c.type==='in'||c.type==='lunchback')start=new Date(c.t);else if((c.type==='out'||c.type==='lunch')&&start){ms+=new Date(c.t)-start;start=null}});if(start)ms+=Date.now()-start;const m=Math.max(0,Math.round(ms/6e4));return Math.floor(m/60)+'h '+(m%60)+'m'}
function clockForm(n,type){

      const d=on?60+Math.floor(Math.random()*300):12672;S.clock.push({who:n,type,t:new Date().toISOString(),onSite:on,dist:d,note:reason});
      log(`${n} clocked ${type} ${on?'at the property':'OFF-SITE, '+dist(d)+' away'}.${reason?' Reason: '+reason:''}`,n);
      if(on){close();toast(type==='in'?'Clocked in. Have a good day.':type==='lunchback'?'Welcome back. You are on the clock.':'Clocked out.');render()}
      else modal(`<h3>Saved, but flagged</h3><p>You are <b>${dist(d)}</b> from the property. Your ${type==='in'?'clock-in':'clock-out'} was saved and your manager will see it marked as off-site.</p><div class="actions"><button class="btn pri" data-close>OK</button></div>`),render();};

const kindName=k=>({in:'Clock-in',out:'Clock-out',lunch:'Lunch start',lunchback:'Back from lunch'})[k]||k;
const t12=hm=>{const[h,m]=hm.split(':').map(Number);return ((h%12)||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')};
function applyFix(who,date,kind,time,note){

  if(ex){ex.orig=ex.orig||ex.t;ex.t=iso;ex.corrected=true;ex.note=note;}
  else S.clock.push({id:uid(),who,type:kind,t:iso,onSite:true,dist:0,corrected:true,note});
}

$('#help').onclick=()=>{
  const names=Object.keys(GUIDES).filter(n=>isMgr()?(!GUIDES[n].role||GUIDES[n].role==='tech'):GUIDES[n].role===role);
  modal(`<h3>Show Me How</h3><p style="font-size:14px;color:var(--muted);margin:0">Pick a task and the app will walk you through it on the real screen, one button at a time.</p>
  <label for="ask">Or type what you're stuck on</label><input id="ask" placeholder="e.g. I charged the wrong late fee">
  <div id="ans"></div><div class="guides">${names.map(n=>`<button class="btn" data-g="${esc(n)}">${esc(n)}</button>`).join('')||'<p style="font-size:14px;color:var(--muted)">No guides for this screen yet.</p>'}</div>
  <div class="note" style="border-color:var(--accent);background:var(--soft)">Still stuck? <button class="btn" id="sup" style="margin-left:6px">Message support</button> <button class="btn" id="cheat" style="margin-left:6px">Print cheat sheets</button></div>
  <div class="actions"><button class="btn" data-close>Close</button></div>`,()=>{
    $('#ask').oninput=e=>{const q=e.target.value.toLowerCase();const hit=q.length>2&&FAQ.find(([re,n])=>re.test(q)&&names.includes(n));$('#ans').innerHTML=hit?`<button class="btn pri choice" data-g="${esc(hit[1])}">Show me: ${esc(hit[1])}</button>`:q.length>2?'<p style="font-size:13px;color:var(--muted)">No match yet. In the full version an AI helper answers any question about the app.</p>':'';bindG()};
    const bindG=()=>document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>startGuide(b.dataset.g));bindG();$('#sup').onclick=supportForm;$('#cheat').onclick=cheatSheets;
  });
};
function startGuide(name){
  const g=GUIDES[name];close();
  if(g.role&&g.role!==role)setRole(g.role);
  if(!g.role&&role!=='mgr')setRole('mgr');
  view=g.tab;render();
  let i=0;
  if(g.openStep===99){g.open();render()}
  const show=()=>{
    const os=g.openStep||0;
    if(g.open&&i>=os&&!$('#layer .sheet'))g.open();
    if(g.open&&i<os&&$('#layer .sheet'))close();
    const[sel,text]=g.steps[i];const el=document.querySelector(sel);
    document.querySelectorAll('.tour-spot,.tour-card').forEach(x=>x.remove());
    if(!el){end();return toast('That step is not available right now.')}
    el.scrollIntoView({block:'center',behavior:'instant'});
    const r=el.getBoundingClientRect();
    const sp=document.createElement('div');sp.className='tour-spot';Object.assign(sp.style,{left:r.left-6+'px',top:r.top-6+'px',width:r.width+12+'px',height:r.height+12+'px'});
    const c=document.createElement('div');c.className='tour-card';c.setAttribute('role','dialog');
    c.innerHTML=`<div class="step">Step ${i+1} of ${g.steps.length}</div><p style="margin:6px 0 12px">${esc(text)}</p><div class="actions" style="justify-content:flex-end"><button class="btn" id="tx">Stop</button>${i?'<button class="btn" id="tb">Back</button>':''}<button class="btn pri" id="tn">${i===g.steps.length-1?'Got it':'Next'}</button></div>`;
    document.body.append(sp,c);
    const below=r.bottom+14+c.offsetHeight<innerHeight;
    c.style.top=(below?r.bottom+14:Math.max(12,r.top-14-c.offsetHeight))+'px';
    c.style.left=Math.min(Math.max(16,r.left),innerWidth-c.offsetWidth-16)+'px';
    $('#tn').onclick=()=>{if(i===g.steps.length-1)return end(true);i++;show()};
    const tb=$('#tb');tb&&(tb.onclick=()=>{i--;show()});$('#tx').onclick=()=>end();$('#tn').focus();
  };
  const end=(ok)=>{document.querySelectorAll('.tour-spot,.tour-card').forEach(x=>x.remove());if(ok)toast('Nice. Now try it yourself.')};
  setTimeout(show,60);
}

// ---------- undo ----------
let undoSnap=null,undoAt=0,undoCur=null,undoMoney='';
const moneySig=s=>s.residents.map(r=>r.charges.length+':'+r.payments.length+':'+r.charges.filter(c=>c.void).length+':'+r.payments.filter(c=>c.void).length).join(',')+'|'+(s.deposits||[]).map(d=>d.status).join(',');
const snapNow=()=>{try{undoSnap=JSON.stringify(S);undoAt=Date.now();undoCur=cur;undoMoney=moneySig(S)}catch(e){undoSnap=null}};
document.addEventListener('pointerdown',e=>{if(e.target.closest('button,[role=button],input[type=checkbox],.btn'))snapNow()},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')snapNow()},true);
const WARN_RX=/^(Enter|Pick|Choose|Type|Describe|Add a|Add the|That |Can't|Couldn't|This phone can't|You need|First|Only|Select|Fill|Nothing|No |Not |Sign first|Please|Write|Give)/;
function toast_base(msg){
  document.querySelectorAll('.toast:not(#offline)').forEach(t=>t.remove());
  const warn=WARN_RX.test(msg);let canUndo=false;
  if(!warn&&undoSnap&&undoCur===cur&&Date.now()-undoAt<5000){try{canUndo=moneySig(S)===undoMoney&&JSON.stringify(S)!==undoSnap}catch(e){}}
  const t=document.createElement('div');t.className='toast'+(warn?' t-warn':'');t.setAttribute('role',warn?'alert':'status');
  t.innerHTML=ico(warn?'alert':'check')+`<span>${esc(msg)}</span>`+(canUndo?`<button class="t-undo" type="button">${ico('undo')}Undo</button>`:'');
  document.body.appendChild(t);
  if(canUndo){const snap=undoSnap,was=view;t.querySelector('.t-undo').onclick=()=>{S=JSON.parse(snap);undoSnap=null;close();S.log.unshift({t:new Date().toISOString(),who:cur.name,text:'Undid: '+msg});view=was;save();render();t.remove();toast('Undone')}}
  setTimeout(()=>t.remove(),canUndo?7000:2800);
}

// ---------- charts (plain HTML bars, hover or tap a bar for the number) ----------
const niceMax=m=>{const p=Math.pow(10,Math.floor(Math.log10(m||1)));return [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=m)||m};
function barChart(title,note,labels,series,fmt){
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.v))),k=Math.ceil(labels.length/8);
  return `<figure class="chart"><figcaption><b>${esc(title)}</b>${note?`<span>${esc(note)}</span>`:''}</figcaption>
  ${series.length>1?`<div class="lg">${series.map((s,j)=>`<span><i class="s${j+1}"></i>${esc(s.n)}</span>`).join('')}</div>`:''}
  <div class="plot"><div class="gy" style="bottom:100%"><span>${fmt(max)}</span></div><div class="gy" style="bottom:50%"><span>${fmt(max/2)}</span></div>
  <div class="bars" style="gap:${labels.length>16?2:series.length>1?10:6}px">${labels.map((l,i)=>`<div class="bc" tabindex="0" aria-label="${esc(l+': '+series.map(s=>(series.length>1?s.n+' ':'')+fmt(s.v[i])).join(', '))}" data-tip="${esc(l+': '+series.map(s=>(series.length>1?s.n+' ':'')+fmt(s.v[i])).join(' · '))}">${series.map((s,j)=>`<i class="s${j+1}" style="height:${s.v[i]>0?`max(2px,${(s.v[i]/max*100).toFixed(1)}%)`:'0'}"></i>`).join('')}</div>`).join('')}</div></div>
  <div class="bx ${labels.length<=8?'few':''}">${labels.map((l,i)=>`<span>${i%k===0?esc(l):''}</span>`).join('')}</div>
  <details><summary>Show as a table</summary><table class="ctab"><thead><tr><th></th>${series.map(s=>`<th>${esc(s.n)}</th>`).join('')}</tr></thead><tbody>${labels.map((l,i)=>`<tr><td>${esc(l)}</td>${series.map(s=>`<td>${fmt(s.v[i])}</td>`).join('')}</tr>`).join('')}</tbody></table></details></figure>`;
}
const fmtK=n=>n>=1000?'$'+(n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,'')+'k':'$'+Math.round(n);
const paidOn=pred=>S.residents.reduce((a,r)=>a+r.payments.filter(q=>!q.void&&pred(q.date)).reduce((x,q)=>x+q.amt,0),0);
function rentByDayChart(){const mk=today.slice(0,7),n=+today.slice(8,10),labels=[],v=[];
  for(let d=1;d<=n;d++){const ds=mk+'-'+String(d).padStart(2,'0');labels.push(new Date(ds+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}));v.push(paidOn(x=>x===ds))}
  return barChart('Rent collected each day this month',money(v.reduce((a,b)=>a+b,0))+' so far',labels,[{n:'Collected',v}],fmtK)}
function woWeeksChart(){const labels=[],o=[],f=[];for(let i=7;i>=0;i--){const s=addDays(-7*i-6),e=addDays(-7*i);labels.push(new Date(s+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}));
    o.push(S.workOrders.filter(w=>w.created>=s&&w.created<=e).length);f.push(S.workOrders.filter(w=>w.status==='Complete'&&(w.doneDate||'')>=s&&(w.doneDate||'')<=e).length)}
  return barChart('Work orders opened and finished, by week','Last 8 weeks',labels,[{n:'Opened',v:o},{n:'Finished',v:f}],n=>String(Math.round(n)))}
function rentByMonthChart(){const labels=[],v=[];for(let i=5;i>=0;i--){const d=new Date(T);d.setDate(1);d.setMonth(d.getMonth()-i);const mk=isoD(d).slice(0,7);labels.push(d.toLocaleDateString('en-US',{month:'short'}));v.push(paidOn(x=>x&&x.slice(0,7)===mk))}
  return v.filter(x=>x>0).length>1?barChart('Rent collected by month','Last 6 months',labels,[{n:'Collected',v}],fmtK):''}

function alertsList_base(){const A=[],add=(n,text,go,lvl)=>{if(n)A.push({n,text,go,lvl})},s=n=>n===1?'':'s',has=k=>!!document.querySelector(`#tabs [data-tab="${k}"]`);
  if(isMgr()||role==='admin'){

    const un=open.filter(w=>w.status==='Open'&&!w.assignee&&hot(w));add(un.length,`${un.length} urgent work order${s(un.length)} not assigned`,'wo','bad');
    if(role!=='asst'){const pv=(S.pendingVoids||[]).length;add(pv,`${pv} reversal${s(pv)} waiting for your OK`,'today','warn')}

    const dep=S.deposits.filter(d=>d.status==='Due'&&daysUntil(addDaysFrom(d.moveOut,30))<=7).length;add(dep,`${dep} deposit refund${s(dep)} due within 7 days`,'rent','bad');

    const bl=S.bills.filter(b=>b.status==='Unpaid'&&b.due<=today).length;add(bl,`${bl} bill${s(bl)} due or overdue`,'accounting','warn');
    const lo=S.inventory.filter(i=>i.qty<i.min).length;add(lo,`${lo} part${s(lo)} running low`,'inventory','mute');
  }else if(role==='tech'){const me=cur.name;
    const al=S.workOrders.filter(w=>w.alert&&!w.alert.ack&&alertTarget(w)===me).length;add(al,`${al} emergency call${s(al)} for you`,'mywo','bad');
    const mine=S.workOrders.filter(w=>w.assignee===me&&w.status==='Assigned'),hotm=mine.filter(hot).length;add(hotm,`${hotm} urgent job${s(hotm)} assigned to you`,'mywo','warn');add(mine.length-hotm,`${mine.length-hotm} other job${s(mine.length-hotm)} assigned to you`,'mywo','mute');

    (S.notify||[]).filter(n=>(r&&n.rid===r.id)||n.unit===cur.unit).slice(-6).reverse().forEach(n=>A.push({n:1,text:n.text,go:'home',lvl:n.t>seen?'warn':'mute',t:n.t}))}
  return A.filter(a=>has(a.go))}

function cpDone(c){modal(`<h3>Mark done · ${esc(c.name)}</h3><label for="cpdd">Date done</label><input id="cpdd" type="date" value="${today}" max="${today}"><label for="cpdv">Done by (company or person)</label><input id="cpdv" value="${esc(c.vendor||'')}"><label class="btn" style="margin-top:14px;display:inline-block">${ico('upload')}Attach the certificate or report<input type="file" id="cpdf" accept="image/*,application/pdf" hidden></label><p id="cpdfn" style="font-size:13px;color:var(--muted)"></p><label for="cpdn">Notes (optional)</label><input id="cpdn" placeholder="e.g. Passed, 2 extinguishers replaced"><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn pri" id="cpdgo">Save</button></div>`,()=>{
  let file=null;$('#cpdf').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{file={name:f.name,data:fr.result};$('#cpdfn').textContent='Attached: '+f.name};fr.readAsDataURL(f)};
  $('#cpdgo').onclick=()=>{const d=$('#cpdd').value;if(!d)return toast('Enter the date it was done');c.last=d;c.next=advance(d,c.every);c.vendor=$('#cpdv').value.trim();if(file)c.certs.unshift({id:uid(),date:d,by:c.vendor,note:$('#cpdn').value.trim(),...file});else if($('#cpdn').value.trim())c.notes=$('#cpdn').value.trim();
